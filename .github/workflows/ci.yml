name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Check API modules load
        run: |
          node --check api/draft-petition.js
          node --check api/consultation.js
          node --check api/_lib/http.js
          node --check api/_lib/legal-references.js
          node --check scripts/fetch-feeds.cjs
