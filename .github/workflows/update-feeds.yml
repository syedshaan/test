name: Update pending feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds into pending files
        run: node scripts/fetch-feeds.cjs

      - name: Commit changes
        run: |
          git config user.name "pleadlaw-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/news.json public/news-pending.json public/jobs.json public/jobs-pending.json
          git diff --staged --quiet || git commit -m "Update pending feeds"
          git pull --rebase origin main
          git push

      - name: Open an issue if the feed run failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Feed update failed (run ${{ github.run_id }})" \
            --body "The scheduled feed update failed. Check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Could not create issue"
